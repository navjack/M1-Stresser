name: Swift macOS CI

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Debug
        run: |
          xcodebuild clean build \
            -project "M1 Stresser.xcodeproj" \
            -scheme "M1 Stresser" \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
