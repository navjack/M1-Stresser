name: Swift macOS CI

# Trigger on pushes & PRs to main (adjust branch name as needed)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build & Test on macOS
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # (Optional) Explicitly select Xcode 16.3 if you want to match your local setup
      #- name: Select Xcode 16.3
      #  uses: maxim-lobanov/setup-xcode@v1
      #  with:
      #    xcode-version: '16.3'

      - name: Build Release
        run: |
          xcodebuild clean build \
            -project "M1 Stresser/M1 Stresser.xcodeproj" \
            -scheme "M1 Stresser" \
            -configuration Debug \
            -sdk macosx \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      # If you have a test target, you can invoke it like this:
      #- name: Run Unit Tests
      #  run: |
      #    xcodebuild test \
      #      -project "M1 Stresser/M1 Stresser.xcodeproj" \
      #      -scheme "M1 Stresser" \
      #      -configuration Debug \
      #      -destination "platform=macOS,arch=arm64" \
      #      CODE_SIGN_IDENTITY="" \
      #      CODE_SIGNING_REQUIRED=NO

