name: Swift macOS CI

on:
workflow_dispatch: {}
push:
branches: [ main ]
pull_request:
branches: [ main ]

jobs:
build-macos:
name: Build Debug on macOS
runs-on: macos-latest
steps:
- name: Check out repository
uses: actions/checkout@v4

  # (Optional) Pin Xcode version to match local environment
  # - name: Set up Xcode 16.3
  #   uses: maxim-lobanov/setup-xcode@v1
  #   with:
  #     xcode-version: '16.3'

  - name: Build Debug
    run: |
      xcodebuild clean build \
        -project "M1 Stresser/M1 Stresser.xcodeproj" \
        -scheme "M1 Stresser" \
        -configuration Debug \
        -sdk macosx \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGNING_REQUIRED=NO

  # (Optional) Run tests
  # - name: Run Unit Tests
  #   run: |
  #       xcodebuild test \
  #         -project "M1 Stresser/M1 Stresser.xcodeproj" \
  #         -scheme "M1 Stresser" \
  #         -configuration Debug \
  #         -destination "platform=macOS,arch=arm64" \
  #         CODE_SIGN_IDENTITY="" \
  #         CODE_SIGNING_REQUIRED=NO
