name: Swift macOS CI

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.3.app
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Debug
        run: |
          xcodebuild clean archive \
            -project "M1 Stresser.xcodeproj" \
            -scheme "M1 Stresser" \
            -configuration Debug \
            -archivePath "./build/M1Stresser.xcarchive" \
            -sdk macosx \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      
      # Export the app from the archive
      - name: Export App
        run: |
          mkdir -p ./build/export
          cp -R "./build/M1Stresser.xcarchive/Products/Applications/M1 Stresser.app" "./build/export/"
          
      # Upload app directory as workflow artifact (not zipped)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M1-Stresser-App
          path: ./build/export/M1 Stresser.app
          retention-days: 14
      
      # Create a zip for the GitHub Release
      - name: Create Release Zip
        run: |
          cd "./build/export"
          zip -r "M1Stresser.zip" "M1 Stresser.app"
          
      # Create GitHub Release with versioned name based on run number and date
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.event.repository.updated_at }})
          files: ./build/export/M1Stresser.zip
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
